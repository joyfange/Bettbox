name: prebuild-codegen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Run build_runner
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d --low-resources-mode

      - name: Commit generated code
        shell: bash
        run: |
          git config user.name "joyfange"
          git config user.email "joyfange@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: commit generated code (build_runner output)"
            git push
          fi
